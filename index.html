<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Verificação de segurança - WL-Cheats</title>
    
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0c10;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .verify-card {
            background: #12141c;
            border-radius: 20px;
            padding: 3rem 2rem;
            max-width: 480px;
            width: 90%;
            text-align: center;
            border: 1px solid #2a2d3a;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .icon {
            width: 70px;
            height: 70px;
            background: #1f2230;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
        }

        .icon svg {
            width: 35px;
            height: 35px;
            color: #8b5cf6;
        }

        h1 {
            color: #fff;
            font-size: 1.5rem;
            margin-bottom: 12px;
        }

        p {
            color: #9ca3af;
            font-size: 0.9rem;
            margin-bottom: 24px;
            line-height: 1.5;
        }

        .status-box {
            background: #1a1d24;
            border-radius: 12px;
            padding: 16px;
            text-align: left;
            margin: 20px 0;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 0;
            color: #9ca3af;
            font-size: 0.85rem;
            border-bottom: 1px solid #252836;
        }

        .status-item:last-child {
            border-bottom: none;
        }

        .status-item.loading {
            color: #8b5cf6;
        }

        .status-item.done {
            color: #10b981;
        }

        .status-item .spinner {
            width: 18px;
            height: 18px;
            border: 2px solid #8b5cf6;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: inline-block;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .cf-turnstile {
            display: flex;
            justify-content: center;
            margin: 20px 0;
            min-height: 85px;
        }

        .btn-verify {
            background: linear-gradient(135deg, #8b5cf6, #7c3aed);
            color: white;
            border: none;
            padding: 14px 24px;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            opacity: 0.5;
            transition: all 0.2s;
        }

        .btn-verify.active {
            opacity: 1;
        }

        .btn-verify.active:hover {
            transform: translateY(-2px);
            background: linear-gradient(135deg, #7c3aed, #6d28d9);
        }

        .footer {
            margin-top: 24px;
            font-size: 0.7rem;
            color: #4b5563;
            border-top: 1px solid #1f2230;
            padding-top: 16px;
        }

        .ray-id {
            font-family: monospace;
            font-size: 0.7rem;
            margin-top: 8px;
            color: #374151;
        }

        .error-msg {
            color: #ef4444;
            font-size: 0.75rem;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="verify-card">
        <div class="icon">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
            </svg>
        </div>
        
        <h1> Executando verificação de segurança</h1>
        <p>Este site utiliza um serviço de segurança para proteção contra bots maliciosos. Complete a verificação abaixo para continuar.</p>

        <div class="status-box" id="statusBox">
            <div class="status-item done" id="status1">
                <span>✓</span> Verificação de segurança ativada
            </div>
            <div class="status-item loading" id="status2">
                <span class="spinner"></span> Aguardando verificação...
            </div>
        </div>

        <div class="cf-turnstile" 
             data-sitekey="0x4AAAAAADbp--rW5yC5rrXX"
             data-callback="onTurnstileSuccess"
             data-theme="dark">
        </div>

        <button class="btn-verify" id="verifyBtn" disabled>Acessar o site</button>
        <div id="errorMsg" class="error-msg"></div>

        <div class="footer">
            <div>🌐 CLOUDFLARE · Proteção contra bots</div>
            <div class="ray-id">Ray ID: <span id="rayId">carregando...</span></div>
        </div>
    </div>

    <script>
        function generateRayId() {
            const chars = 'abcdef0123456789';
            let id = '';
            for (let i = 0; i < 16; i++) {
                id += chars[Math.floor(Math.random() * chars.length)];
            }
            return id;
        }

        document.getElementById('rayId').innerText = generateRayId();

        let captchaOk = false;
        let turnstileToken = '';

        window.onTurnstileSuccess = function(token) {
            captchaOk = true;
            turnstileToken = token;
            
            document.getElementById('status2').innerHTML = '<span>✓</span> Verificação concluída! Clique em "Acessar o site"';
            document.getElementById('status2').classList.remove('loading');
            document.getElementById('status2').classList.add('done');
            
            const btn = document.getElementById('verifyBtn');
            btn.disabled = false;
            btn.classList.add('active');
        };

        document.getElementById('verifyBtn').onclick = function() {
            if (!captchaOk) {
                document.getElementById('errorMsg').innerHTML = '❌ Complete o captcha primeiro!';
                document.getElementById('errorMsg').style.display = 'block';
                return;
            }
            
            // Vai direto pro conteúdo (SEM COOKIE)
            window.location.href = '/wl';
        };
    </script>
</body>
</html>
